<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MONDE AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#05070E] text-slate-100 font-sans select-none overflow-hidden h-screen flex flex-col justify-between">
  <header class="pt-10 px-6 pb-3 flex justify-between items-center border-b border-cyan-950/40 bg-[#05070E]/80 backdrop-blur-md">
    <div>
      <div class="flex items-center space-x-2">
        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
        <h1 class="text-lg font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-violet-400">MONDE AI</h1>
      </div>
      <p class="text-[10px] tracking-widest text-slate-400 uppercase">By Monde Dubasi</p>
    </div>
    <div class="flex space-x-2">
      <button id="btn-memory" class="p-2 rounded-xl bg-[#0D121F] border border-cyan-500/20 text-cyan-400 text-xs">Memory</button>
      <button id="btn-settings" class="p-2 rounded-xl bg-[#0D121F] border border-violet-500/20 text-violet-400 text-xs">Settings</button>
    </div>
  </header>
  <div class="relative flex-1 flex flex-col items-center justify-center px-4">
    <div id="orb-core" class="w-36 h-36 rounded-full bg-gradient-to-br from-cyan-400 via-violet-600 to-indigo-900 shadow-[0_0_50px_rgba(0,242,254,0.4)] flex items-center justify-center cursor-pointer">
      <canvas id="orb-canvas" width="144" height="144" class="rounded-full"></canvas>
    </div>
    <div id="status-label" class="mt-4 text-xs font-semibold tracking-wider text-cyan-300 uppercase">Listening for "Hey Monde"...</div>
    <div id="chat-stream" class="w-full max-w-md h-36 mt-2 overflow-y-auto px-4 space-y-2 text-xs flex flex-col">
      <div class="p-3 bg-[#0C101D] border border-cyan-900/30 rounded-2xl self-start">Ready, Monde. Say "Hey Monde" or tap the orb.</div>
    </div>
  </div>
  <footer class="p-6 bg-[#05070E]/90 border-t border-slate-900 flex justify-center">
    <button id="btn-mic-toggle" class="w-full max-w-sm py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-violet-600 text-slate-950 font-bold">Tap to Talk</button>
  </footer>
  <div id="modal-memory" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex flex-col justify-end">
    <div class="bg-[#0B0F1C] border-t border-cyan-500/20 rounded-t-3xl p-6 h-[70vh] flex flex-col">
      <div class="flex justify-between mb-2"><h2 class="text-sm font-bold text-cyan-400">Memory Bank</h2><button id="btn-close-memory" class="text-xs text-slate-400">Close</button></div>
      <div id="memory-list" class="flex-1 overflow-y-auto space-y-2 text-xs"></div>
      <div class="mt-2 flex space-x-2">
        <input id="input-new-memory" type="text" placeholder="Add fact..." class="flex-1 bg-black border border-cyan-900 rounded-xl px-3 py-2 text-xs text-slate-200">
        <button id="btn-add-memory" class="px-3 bg-cyan-400 text-black font-bold text-xs rounded-xl">Save</button>
      </div>
    </div>
  </div>
  <div id="modal-settings" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex flex-col justify-end">
    <div class="bg-[#0B0F1C] border-t border-violet-500/20 rounded-t-3xl p-6 h-[50vh] flex flex-col justify-between">
      <div>
        <div class="flex justify-between mb-4"><h2 class="text-sm font-bold text-violet-400">Settings</h2><button id="btn-close-settings" class="text-xs text-slate-400">Close</button></div>
        <label class="text-xs text-slate-300">Gemini API Key</label>
        <input id="input-api-key" type="password" placeholder="AIzaSy..." class="w-full bg-black border border-violet-900 rounded-xl px-3 py-2 text-xs text-slate-200 font-mono mt-1">
      </div>
      <button id="btn-save-settings" class="w-full py-3 bg-violet-600 font-bold rounded-xl text-xs text-white">Save Key</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
