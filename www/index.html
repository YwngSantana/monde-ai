<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONDE AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#05070E] text-slate-100 font-sans select-none flex flex-col h-screen overflow-hidden">
  
  <!-- Header -->
  <header class="pt-8 px-6 pb-2 flex justify-between items-center shrink-0">
    <div>
      <div class="flex items-center space-x-2">
        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
        <h1 class="text-lg font-bold tracking-wider text-white">MONDE AI</h1>
      </div>
      <p class="text-[10px] tracking-widest text-slate-400">BY MONDE DUBASI</p>
    </div>
    <div class="flex space-x-2">
      <button id="btn-memory" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">Memory</button>
      <button id="btn-settings" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">Settings</button>
    </div>
  </header>

  <!-- Main Screen: Compact Orb & Big Full-Height Chat -->
  <main class="flex-1 flex flex-col items-center w-full px-4 overflow-hidden">
    <!-- Compact Orb -->
    <div class="flex flex-col items-center my-2 shrink-0">
      <div id="orb-core" class="w-16 h-16 rounded-full bg-gradient-to-tr from-cyan-500 via-indigo-500 to-purple-600 shadow-md shadow-cyan-500/30 flex items-center justify-center cursor-pointer active:scale-95 transition-all">
        <canvas id="orb-canvas" width="64" height="64"></canvas>
      </div>
      <div id="status-label" class="mt-1 text-[11px] font-bold text-cyan-400 tracking-wider uppercase">READY, MONDE</div>
    </div>

    <!-- Big Chat Stream Window -->
    <div id="chat-stream" class="flex-1 w-full max-w-lg overflow-y-auto flex flex-col space-y-3 p-3 bg-slate-900/60 rounded-2xl border border-slate-800 shadow-inner">
      <div class="p-3.5 bg-slate-800/90 rounded-2xl text-slate-100 border border-slate-700/60 mr-6 shadow-sm">
        <div class="text-[11px] font-bold text-cyan-400 mb-1 uppercase tracking-wider">MONDE AI</div>
        <div class="text-base leading-relaxed">Ready, Monde. Say something or type below.</div>
      </div>
    </div>
  </main>

  <!-- Footer: Text Box + Voice Button -->
  <footer class="p-3 bg-[#05070E]/95 border-t border-slate-800 flex flex-col items-center gap-2 w-full shrink-0">
    <form id="text-form" class="flex w-full max-w-lg gap-2" onsubmit="return false;">
      <input id="input-text-msg" type="text" placeholder="Type a message to Monde AI..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-base focus:outline-none focus:border-cyan-500 shadow-inner" />
      <button type="submit" id="btn-text-send" class="bg-cyan-500 active:bg-cyan-600 text-slate-950 font-bold px-5 py-3 rounded-xl text-base shadow-md">Send</button>
    </form>
    <button id="btn-mic-toggle" class="w-full max-w-lg py-2.5 rounded-xl font-bold bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-md active:scale-95 transition-all text-sm">Tap to Talk</button>
  </footer>

  <!-- Memory Modal -->
  <div id="modal-memory" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-[#0B0F1C] border border-cyan-500/30 rounded-2xl p-4 w-full max-w-md max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-wider">Monde AI Memory</h2>
        <button id="btn-close-memory" class="text-slate-400 text-lg">&times;</button>
      </div>
      <div id="memory-list" class="flex-1 overflow-y-auto space-y-2 mb-3"></div>
      <div class="flex gap-2">
        <input id="input-new-memory" type="text" placeholder="Add memory..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none" />
        <button id="btn-add-memory" class="bg-cyan-500 text-slate-950 font-bold px-3 py-2 rounded-xl text-sm">Add</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal (With Monde Voice Option) -->
  <div id="modal-settings" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-[#0B0F1C] border border-violet-500/30 rounded-2xl p-5 w-full max-w-md flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-sm font-bold text-violet-400 uppercase tracking-wider">Settings</h2>
        <button id="btn-close-settings" class="text-slate-400 text-lg">&times;</button>
      </div>

      <label class="text-xs text-slate-300 mb-1">Google Gemini API Key</label>
      <input id="input-api-key" type="password" placeholder="Paste your API key here" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-violet-500 mb-3" />

      <label class="text-xs text-slate-300 mb-1">Choose AI Voice</label>
      <select id="select-voice" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-violet-500 mb-3">
        <option value="Brian">Monde — Signature Male Voice</option>
        <option value="Matthew">Alex — American Male</option>
        <option value="Emma">Emma — British Female</option>
      </select>

      <!-- Instant Voice Test -->
      <button type="button" id="btn-test-voice" class="w-full py-2.5 mb-3 bg-slate-800 border border-cyan-500/40 text-cyan-300 font-semibold rounded-xl text-xs flex items-center justify-center gap-2 active:bg-cyan-950">
        🔊 Test Voice Now
      </button>

      <button id="btn-save-settings" class="w-full py-3 bg-violet-600 hover:bg-violet-500 text-white font-bold rounded-xl text-sm">Save Settings</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
