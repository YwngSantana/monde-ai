name: Build MONDE AI Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install
          npm install --save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true

      - name: Inject Android Permissions
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(file)) {
              let xml = fs.readFileSync(file, "utf8");
              const perms = `
                <uses-permission android:name="android.permission.RECORD_AUDIO" />
                <uses-permission android:name="android.permission.INTERNET" />
                <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
                <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              `;
              if (!xml.includes("RECORD_AUDIO")) {
                xml = xml.replace("<application", perms + "\n    <application");
                fs.writeFileSync(file, xml);
              }
            }
          '

      - name: Sync Android Assets
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MONDE-AI-Installer
          path: android/app/build/outputs/apk/debug/app-debug.apk
